# Monta o APK do Scanabla nos servidores do GitHub a cada envio de código.
# O APK fica disponível em "Releases" (download direto pelo celular) e em "Actions" (artefato).
name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assinatura fixa (opcional, permite atualizar sem desinstalar)
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Usando a chave fixa do repositório."
          fi

      - name: Montar o APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk scanabla.apk

      - name: Guardar o APK (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: scanabla.apk
          path: scanabla.apk

      - name: Publicar em Releases (link direto para o celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Scanabla (versão ${{ github.run_number }})
          body: Baixe o arquivo scanabla.apk abaixo direto no celular e instale.
          files: scanabla.apk

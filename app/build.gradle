plugins {
    id 'com.android.application'
}

android {
    namespace 'br.scanner.pdf'
    compileSdk 35

    defaultConfig {
        // Novo identificador: o Scanabla instala ao lado do antigo "Scanner PDF" sem apagar nada.
        applicationId 'br.scanabla'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*'
            ]
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Scanner de documentos do Google (recorte de bordas, filtros, várias páginas, gera PDF).
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    // Leitura de texto (OCR) pelo Google Play Services: deixa o app pequeno.
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    // Editar PDFs: unir, reordenar, girar, excluir páginas.
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
